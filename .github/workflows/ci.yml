name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: test:integration
        run: npm run test:integration

      - name: test:mock-llm
        run: npm run test:mock-llm

      # Not in this job: test:live (needs a real herdr), test:docker (needs
      # image pi-herdr-sandbox:latest plus a host Pi agent dir). See release.yml.
