name: tui-sandbox image

# 构建并发布 TUI QA 沙箱镜像到 ghcr.io（docs/tui-qa-playbook.md §1.4/§11）。
# 本地复现：docker build -f test/docker/Dockerfile.tui-sandbox -t ghcr.io/zzjcool/pi-legion/tui-sandbox:latest .
#（需要 write:packages 权限的 token 才能 push；CI 用 GITHUB_TOKEN 自动具备。）

on:
  push:
    branches: [master]
    paths:
      - "test/docker/Dockerfile.tui-sandbox"
      - "test/tui/ansi2png.py"
      - "test/docker/verify-tui-visual.sh"
      - ".github/workflows/docker-tui-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/tui-sandbox

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: test/docker/Dockerfile.tui-sandbox
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
