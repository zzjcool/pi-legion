name: Release

# Semver-style tags only, for example v2.0.0 or v2.0.0-beta.1.
# A tag such as v2 or v2.0 does not match and will not publish.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # npm trusted publishing (OIDC): the job exchanges this token for a
  # short-lived publish credential instead of a stored NPM_TOKEN.
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: test:integration
        run: npm run test:integration

      - name: test:mock-llm
        run: npm run test:mock-llm

      # test:docker is omitted. verify-*.sh runs docker with image
      # pi-herdr-sandbox:latest (override: PI_DOCKER_IMAGE) and copies a host
      # Pi agent dir (HOST_PI_AGENT, default /root/.pi/agent) that must already
      # contain settings.json and models.json. GitHub-hosted runners have
      # neither, so the script fails before any package check. Local
      # alternative, once that image and Pi home exist:
      #   npm run test:docker

      - name: Check tag matches package.json version
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          expected="v${pkg_version}"
          if [ "${tag}" != "${expected}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${pkg_version} (expected ${expected}). Bump package.json and push a matching tag together; npm stage publish uses the version field, not the tag."
            exit 1
          fi
          echo "Tag ${tag} matches package.json ${pkg_version}."

      # npm always packs package.json, so an install-phase script declared here
      # reaches every consumer. Pi installs extensions with plain `npm install`,
      # so a pnpm-only `preinstall` guard (3.0.0) made `pi update --extensions`
      # fail for everyone. Keep the manifest script-free: contributors install
      # with npm like every consumer does.
      - name: Reject install-phase scripts in the published manifest
        run: |
          set -euo pipefail
          for script in preinstall install postinstall; do
            declared=$(node -p "require('./package.json')\
              .scripts?.['${script}'] ?? ''")
            if [ -n "${declared}" ]; then
              echo "::error::scripts.${script} runs in every consumer install."
              echo "::error::Remove it; the manifest must stay script-free."
              exit 1
            fi
          done
          echo "No install-phase scripts in the published manifest."

      # A package-manager guard in package.json would break consumers: npm
      # enforces devEngines.packageManager for every command in the checkout
      # (including `pi install git:...` -> npm install) and corepack refuses
      # to run npm when `packageManager` names pnpm. See issue #210.
      - name: Reject package-manager enforcement
        run: |
          set -euo pipefail
          for field in devEngines packageManager; do
            declared=$(node -p "const m=require('./package.json');\
              m['${field}'] === undefined ? '' : 'declared'")
            if [ -n "${declared}" ]; then
              echo "::error::package.json ${field} blocks npm consumers."
              echo "::error::See issue #210 before reintroducing it."
              exit 1
            fi
          done
          echo "No package-manager enforcement in the published manifest."

      - name: Read tag annotation
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="${RUNNER_TEMP}/tag-annotation.md"
          git for-each-ref "refs/tags/${tag}" --format='%(contents)' > "${out}"
          if ! grep -q '[^[:space:]]' "${out}"; then
            printf '%s\n' "_此 tag 没有 annotation。变更说明见下方自动生成的提交记录。_" > "${out}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/tag-annotation.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Setup npm publish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org

      # Trusted publishing (npm OIDC). No NPM_TOKEN and no manual stage
      # approval: the registry trusts this repository + workflow filename
      # (`release.yml`), and `id-token: write` lets the npm CLI exchange the
      # job's OIDC token for a short-lived publish credential. Provenance is
      # attached from the same token, so the tarball is verifiably built from
      # this commit.
      #
      # Requires npm CLI >= 11.5.1 for the exchange (Node 22 still bundles npm
      # 10, hence the upgrade) and Node >= 22.14, which `node-version: 22` with
      # `check-latest` already satisfies.
      - name: Publish to npm (trusted publishing)
        run: |
          set -euo pipefail
          npm install -g npm@^11.15.0
          npm publish --provenance --access public
          echo "Published $(node -p "require('./package.json').name + '@' + require('./package.json').version") with provenance."
