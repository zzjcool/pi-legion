name: Release

# Semver-style tags only, for example v2.0.0 or v2.0.0-beta.1.
# A tag such as v2 or v2.0 does not match and will not publish.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test

      - name: test:integration
        run: pnpm run test:integration

      - name: test:mock-llm
        run: pnpm run test:mock-llm

      # test:docker is omitted. verify-*.sh runs docker with image
      # pi-herdr-sandbox:latest (override: PI_DOCKER_IMAGE) and copies a host
      # Pi agent dir (HOST_PI_AGENT, default /root/.pi/agent) that must already
      # contain settings.json and models.json. GitHub-hosted runners have
      # neither, so the script fails before any package check. Local
      # alternative, once that image and Pi home exist:
      #   pnpm run test:docker

      - name: Check tag matches package.json version
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          expected="v${pkg_version}"
          if [ "${tag}" != "${expected}" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${pkg_version} (expected ${expected}). Bump package.json and push a matching tag together; npm stage publish uses the version field, not the tag."
            exit 1
          fi
          echo "Tag ${tag} matches package.json ${pkg_version}."

      - name: Read tag annotation
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          out="${RUNNER_TEMP}/tag-annotation.md"
          git for-each-ref "refs/tags/${tag}" --format='%(contents)' > "${out}"
          if ! grep -q '[^[:space:]]' "${out}"; then
            printf '%s\n' "_此 tag 没有 annotation。变更说明见下方自动生成的提交记录。_" > "${out}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/tag-annotation.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Setup npm auth
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org

      # Deps are installed with pnpm above. Staging still uses the npm CLI.
      # CI only stages the package on npm. It does not formally publish.
      # A maintainer must complete npm 2FA (`npm stage approve`) afterwards.
      # NPM_TOKEN is a granular token with Read and write (stage only), which
      # can stage and cannot publish directly.
      # Requires npm CLI >= 11.15 and Node >= 22.14. node-version 22 with
      # check-latest already satisfies the Node requirement. Node 22 still
      # bundles npm 10, so install the npm 11 CLI before staging.
      - name: Stage on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Repository secret NPM_TOKEN is not set. GitHub Release for this tag was already created. Add the granular npm token (Read and write, stage only) as NPM_TOKEN, then re-run. This step only stages pi-legion; a maintainer must approve it with npm 2FA before it is published."
            exit 1
          fi
          npm install -g npm@^11.15.0
          if ! npm stage publish; then
            echo "::error::npm stage publish failed. CI only stages the package and does not put it live. After a successful stage, a maintainer must complete npm 2FA (npm stage approve) to formally publish."
            exit 1
          fi
          echo "Staged only. pi-legion is not live. A maintainer must complete npm 2FA (npm stage approve) to formally publish."
